[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nidan-ai"
version = "0.1.0"
description = "NIDAN physics-twin and machine-learning scoring engine (advisory, non-vital)"
readme = "README.md"
requires-python = ">=3.12"
license = "Proprietary"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]
graph = [
  "torch>=2.2",
]

[tool.setuptools.packages.find]
include = ["nidan_ai*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: heavier numerical tests (deselect with -m 'not slow')",
  "integration: live backend or database required",
]
filterwarnings = [
  "error::DeprecationWarning:nidan_ai.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

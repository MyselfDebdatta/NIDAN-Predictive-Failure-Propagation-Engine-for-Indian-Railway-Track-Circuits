name: NIDAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if Nidan-Frontend exists
        id: check
        shell: bash
        run: |
          if [ -f "Nidan-Frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Nidan-Frontend/package.json not present on this branch; skipping frontend build/tests."
          fi

      - name: Setup Bun
        if: steps.check.outputs.exists == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: Nidan-Frontend
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        working-directory: Nidan-Frontend
        run: bunx tsc --noEmit

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: Nidan-Frontend
        run: bun run lint

      - name: Unit & safety tests
        if: steps.check.outputs.exists == 'true'
        working-directory: Nidan-Frontend
        run: bunx vitest run

      - name: Production build
        if: steps.check.outputs.exists == 'true'
        working-directory: Nidan-Frontend
        run: bun run build

  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect backend files
        id: check
        shell: bash
        run: |
          if [ -d "backend" ] && [ -n "$(find backend -maxdepth 3 \( -name '*.py' -o -name 'requirements*.txt' -o -name 'pyproject.toml' \) 2>/dev/null)" ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
            echo "No Python backend application files present yet; skipping Python lint/tests."
          fi

      - name: Setup Python
        if: steps.check.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        if: steps.check.outputs.has_python == 'true'
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "pyproject.toml" ]; then
            pip install -e ".[dev]" || pip install -e .
          fi
          pip install ruff pytest

      - name: Lint backend with Ruff
        if: steps.check.outputs.has_python == 'true'
        working-directory: backend
        run: ruff check .

      - name: Run pytest
        if: steps.check.outputs.has_python == 'true'
        working-directory: backend
        shell: bash
        run: |
          if [ -n "$(find . -maxdepth 3 \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null)" ]; then
            pytest
          else
            echo "No pytest files found yet."
          fi

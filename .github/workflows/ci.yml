name: NIDAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if Nidan-Frontend exists
        id: check
        shell: bash
        run: |
          if [ -f "Nidan-Frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Nidan-Frontend/package.json not present on this branch; skipping frontend build/tests."
          fi

      - name: Setup Bun
        if: steps.check.outputs.exists == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: Nidan-Frontend
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        working-directory: Nidan-Frontend
        run: bunx tsc --noEmit

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: Nidan-Frontend
        run: bun run lint

      - name: Unit & safety tests
        if: steps.check.outputs.exists == 'true'
        working-directory: Nidan-Frontend
        run: bunx vitest run

      - name: Production build
        if: steps.check.outputs.exists == 'true'
        working-directory: Nidan-Frontend
        run: bun run build

  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect backend files
        id: check
        shell: bash
        run: |
          if [ -d "backend" ] && [ -n "$(find backend -maxdepth 3 \( -name '*.py' -o -name 'requirements*.txt' -o -name 'pyproject.toml' \) 2>/dev/null)" ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
            echo "No Python backend application files present yet; skipping Python lint/tests."
          fi

      - name: Setup Python
        if: steps.check.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        if: steps.check.outputs.has_python == 'true'
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "pyproject.toml" ]; then
            pip install -e ".[dev]" || pip install -e .
          fi
          pip install ruff pytest

      - name: Check backend formatting with Ruff
        if: steps.check.outputs.has_python == 'true'
        working-directory: backend
        run: ruff format --check .

      - name: Lint backend with Ruff
        if: steps.check.outputs.has_python == 'true'
        working-directory: backend
        run: ruff check .

      - name: Run unit & contract pytest
        if: steps.check.outputs.has_python == 'true'
        working-directory: backend
        shell: bash
        run: |
          if [ -n "$(find . -maxdepth 3 \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null)" ]; then
            pytest -v -m "not integration"
          else
            echo "No pytest files found yet."
          fi

  backend-integration-ci:
    name: backend-integration-ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nidan
          POSTGRES_USER: nidan
          POSTGRES_PASSWORD: nidan_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nidan -d nidan"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client & backend dependencies
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Initialize & seed PostgreSQL 16 + verify Alembic baseline
        working-directory: backend
        env:
          PGPASSWORD: nidan_dev_password
          DATABASE_URL: postgresql://nidan:nidan_dev_password@localhost:5432/nidan
        run: |
          psql -h localhost -U nidan -d nidan -v ON_ERROR_STOP=1 -f db/0001_init.sql
          psql -h localhost -U nidan -d nidan -v ON_ERROR_STOP=1 -f db/seed.sql
          python -m alembic stamp 0001
          python -m alembic upgrade head
          python -m alembic current

      - name: Run live Postgres + Redis integration tests
        working-directory: backend
        env:
          NIDAN_TEST_DATABASE_URL: postgresql://nidan:nidan_dev_password@localhost:5432/nidan
          NIDAN_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -v -m integration

  ai-ci:
    name: ai-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect ai package
        id: check
        shell: bash
        run: |
          if [ -f "ai/pyproject.toml" ]; then
            echo "has_ai=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ai=false" >> "$GITHUB_OUTPUT"
            echo "ai/pyproject.toml not present; skipping ai-ci."
          fi

      - name: Setup Python
        if: steps.check.outputs.has_ai == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend and ai packages
        if: steps.check.outputs.has_ai == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e backend
          pip install -e "ai[dev]"

      - name: Check ai formatting with Ruff
        if: steps.check.outputs.has_ai == 'true'
        run: ruff format --check ai

      - name: Lint ai with Ruff
        if: steps.check.outputs.has_ai == 'true'
        run: ruff check ai

      - name: Run ai unit, contract and safety tests
        if: steps.check.outputs.has_ai == 'true'
        run: pytest ai/tests -v -m "not slow and not integration"

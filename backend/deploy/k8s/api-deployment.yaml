apiVersion: apps/v1
kind: Deployment
metadata:
  name: nidan-api
  namespace: nidan-advisory
  labels:
    app: nidan-api
    nidan.railways.in/safety-tier: non-vital-advisory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nidan-api
  template:
    metadata:
      labels:
        app: nidan-api
        nidan.railways.in/safety-tier: non-vital-advisory
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/nidan-railways/nidan-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: nidan-api-config
            - secretRef:
                name: nidan-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nidan-api
  namespace: nidan-advisory
  labels:
    app: nidan-api
spec:
  selector:
    app: nidan-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nidan-api-hpa
  namespace: nidan-advisory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nidan-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nidan-api-pdb
  namespace: nidan-advisory
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nidan-api
